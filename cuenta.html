<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi cuenta — Omeganetics</title>
  <style>
    :root { --bg: #0c0c14; --card: #15151f; --accent: #5865F2; --text: #e8e8f0; --muted: #9a9ab0; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at top, #1a1a2e, var(--bg));
      color: var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .card {
      background: var(--card); border: 1px solid #262636; border-radius: 16px;
      padding: 40px; width: min(420px, 92vw); text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    p.sub { color: var(--muted); margin: 0 0 28px; }
    .avatar { width: 96px; height: 96px; border-radius: 50%; border: 3px solid var(--accent); margin-bottom: 16px; }
    .btn {
      display: inline-flex; align-items: center; gap: 10px; justify-content: center;
      background: var(--accent); color: #fff; border: none; border-radius: 10px;
      padding: 14px 22px; font-size: 1rem; font-weight: 600; cursor: pointer; text-decoration: none;
      transition: filter .15s;
    }
    .btn:hover { filter: brightness(1.1); }
    .btn.secondary { background: transparent; border: 1px solid #33334a; color: var(--muted); margin-top: 14px; padding: 10px 18px; font-size: .9rem; }
    .hidden { display: none; }
    .name { font-size: 1.25rem; font-weight: 700; }
    .tag { color: var(--muted); font-size: .9rem; }
  </style>
</head>
<body>
  <div class="card">
    <div id="loading"><p class="sub">Cargando…</p></div>

    <div id="guest" class="hidden">
      <h1>Entra a Omeganetics</h1>
      <p class="sub">Conéctate con tu cuenta de Discord. Solo para miembros del servidor.</p>
      <a class="btn" href="/api/auth/discord">
        <svg width="22" height="22" viewBox="0 0 127 96" fill="#fff"><path d="M107.7 8.07A105.15 105.15 0 0 0 81.47 0a72.06 72.06 0 0 0-3.36 6.83 97.68 97.68 0 0 0-29.11 0A72.37 72.37 0 0 0 45.64 0a105.89 105.89 0 0 0-26.25 8.09C2.79 32.65-1.71 56.6.54 80.21a105.73 105.73 0 0 0 32.17 16.15 77.7 77.7 0 0 0 6.89-11.11 68.42 68.42 0 0 1-10.85-5.18c.91-.66 1.8-1.34 2.66-2a75.57 75.57 0 0 0 64.32 0c.87.71 1.76 1.39 2.66 2a68.68 68.68 0 0 1-10.87 5.19 77 77 0 0 0 6.89 11.1 105.25 105.25 0 0 0 32.19-16.14c2.64-27.38-4.51-51.11-18.9-72.15ZM42.45 65.69C36.18 65.69 31 60 31 53s5-12.74 11.43-12.74S54 46 53.89 53s-5.05 12.69-11.44 12.69Zm42.24 0C78.41 65.69 73.25 60 73.25 53s5-12.74 11.44-12.74S96.23 46 96.12 53s-5.04 12.69-11.43 12.69Z"/></svg>
        Entrar con Discord
      </a>
    </div>

    <div id="user" class="hidden">
      <img id="u-avatar" class="avatar" alt="avatar" />
      <div class="name" id="u-name"></div>
      <div class="tag" id="u-tag"></div>
      <p class="sub" style="margin-top:18px">¡Bienvenido a la comunidad! 🎮</p>
      <button class="btn secondary" id="logout">Cerrar sesión</button>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const show = (id) => { ['loading','guest','user'].forEach(s => $(s).classList.add('hidden')); $(id).classList.remove('hidden'); };

    async function load() {
      try {
        const res = await fetch('/api/auth/me');
        if (!res.ok) return show('guest');
        const u = await res.json();
        $('u-name').textContent = u.globalName || u.username;
        $('u-tag').textContent = '@' + u.username;
        if (u.avatar) { $('u-avatar').src = u.avatar; } else { $('u-avatar').style.display = 'none'; }
        show('user');
      } catch (e) {
        show('guest');
      }
    }

    $('logout').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      load();
    });

    load();
  </script>
</body>
</html>
