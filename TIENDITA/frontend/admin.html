<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel Admin</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="tienda-theme.css">
<link rel="stylesheet" href="/css/site-extra.css">
</head>
<body class="admin-page storefront-page">

<header class="header">
  <div class="brand-shell">
    <span class="logo-hint"><span class="logo-hint-chip">Admin</span> Gestión rápida del catálogo</span>
    <h1>Panel de catálogo</h1>
  </div>
  <nav>
    <a href="indextienda.html" class="btn btn-secondary">Inicio</a>
    <a href="subir.html" class="btn">Subir proyecto</a>
    <button class="btn btn-danger" onclick="cerrarSesion()">Cerrar sesión</button>
  </nav>
</header>

<main class="admin-shell">
  <section class="admin-intro">
    <div>
      <h2>Panel de administración</h2>
    </div>
    <article class="admin-summary-card">
      <strong id="adminTotal">0</strong>
      <span>proyectos activos</span>
    </article>
  </section>

  <section class="admin-toolbar">
    <input id="buscar" placeholder="Buscar por nombre o categoría..." oninput="buscarProyecto()" aria-label="Buscar proyectos">
    <p class="field-help">Busca por nombre, categoría o tipo de recurso.</p>
  </section>

  <div id="lista" class="grid"></div>
</main>

<script>

const API_BASE = "/api";
const UPLOADS_BASE = "/uploads";

// El acceso ya lo protege el servidor (sesión de Discord admin). No hay token propio.
function imgUrl(name) {
  if (!name) return "";
  return /^https?:\/\//i.test(name) ? name : `${UPLOADS_BASE}/${encodeURIComponent(name)}`;
}

function cerrarSesion() {
  window.location.href = "/";
}

let proyectos = [];

async function cargarAdmin() {
  const res = await fetch(`${API_BASE}/proyectos/listar`);
  proyectos = await res.json();
  mostrar(proyectos);
}

function mostrar(data) {
  const cont = document.getElementById("lista");
  const total = document.getElementById("adminTotal");
  cont.innerHTML = "";
  if (total) total.textContent = String(data.length || 0);

  data.forEach(p => {
    const galeria = Array.isArray(p.imagenes) ? p.imagenes.length : 0;
    const tieneArchivo = Boolean(p.archivo);

    cont.innerHTML += `
      <article class="card-proyecto admin-card">
        <div class="card-imagen-wrap">
          <img class="card-portada" src="${imgUrl(p.portada)}" alt="Portada de ${p.nombre}">
        </div>
        <div class="card-contenido">
          <div class="card-cabecera">
            <p class="card-categoria">${p.categoria}</p>
            <small class="card-fecha">${new Date(p.fecha).toLocaleDateString()}</small>
          </div>
          <h3 class="card-titulo">${p.nombre}</h3>
          <div class="card-badges">
            <span class="mini-badge mini-badge--gallery">${galeria} vista${galeria === 1 ? "" : "s"}</span>
            <span class="mini-badge ${tieneArchivo ? "mini-badge--download" : "mini-badge--new"}">${tieneArchivo ? "Descargable" : "Galería"}</span>
          </div>
          <div class="admin-actions">
            <button class="btn btn-danger" onclick="eliminar(${p.id})">Eliminar</button>
          </div>
        </div>
      </article>
    `;
  });
}

// BUSCAR
function buscarProyecto() {
  const texto = document.getElementById("buscar").value.toLowerCase();

  const filtrados = proyectos.filter(p =>
    p.nombre.toLowerCase().includes(texto) ||
    String(p.categoria || "").toLowerCase().includes(texto)
  );

  mostrar(filtrados);
}

// ELIMINAR
async function eliminar(id) {
  if (!confirm("¿Eliminar proyecto?")) return;

  const res = await fetch(`${API_BASE}/proyectos/eliminar/${id}`, {
    method: "DELETE"
  });

  if (res.status === 401 || res.status === 403) {
    alert("Necesitas sesión de administrador de Discord.");
    window.location.href = "/login.html";
    return;
  }

  cargarAdmin();
}

cargarAdmin();

</script>
</body>
</html>
